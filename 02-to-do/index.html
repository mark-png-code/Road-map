<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="card">
        <h1>To-Do List</h1>
        <form id="task-form">
            <input type="text" id="task-input" placeholder="Enter a new task" autoComplete="off" autoFocus>
            <button id="add-task-button" type="submit">Add Task</button>
        </form>
        <p id="empty-list-message" hidden>Nothing to do!</p>
        <section id="filter-buttons">
            <button id="filter-all" class="filter-button active">All</button>
            <button id="filter-active" class="filter-button">Active</button>
            <button id="filter-completed" class="filter-button">Completed</button>
        </section>
        <ul id="task-list"></ul>
        <p id="task-count">All done</p>
        <button id="clear-completed-button">Clear Completed</button>
    </main>
    <script src="script.js"></script>
</body>
</html>
